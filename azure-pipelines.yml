trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: Execute_Functions
    steps:
      - checkout: self
        persistCredentials: true
        
      - task: PowerShell@2
        displayName: 'Install Required Modules'
        inputs:
          targetType: 'inline'
          script: |
            Write-Host "Installing Az.Storage module..."
            Install-Module -Name Az.Storage -Force -Scope CurrentUser -AllowClobber -Repository PSGallery
            
            Write-Host "Installing SqlServer module..."
            Install-Module -Name SqlServer -Force -Scope CurrentUser -AllowClobber -Repository PSGallery
            
            Write-Host "Modules installed successfully"
            Get-Module -ListAvailable Az.Storage, SqlServer | Format-Table Name, Version
          pwsh: true

      - task: PowerShell@2
        displayName: 'Inject Secrets into Config (Optional)'
        inputs:
          targetType: 'inline'
          script: |
            $configPath = "config.json"
            Write-Host "Checking for secret injection..."
            
            # Debug: Show what we're receiving
            Write-Host "DEBUG: AZURE_STORAGE_CONN length: $($env:AZURE_STORAGE_CONN.Length)"
            Write-Host "DEBUG: AZURE_SQL_CONN length: $($env:AZURE_SQL_CONN.Length)"
            Write-Host "DEBUG: AZURE_COG_API_KEY length: $($env:AZURE_COG_API_KEY.Length)"
            Write-Host "DEBUG: AZURE_STORAGE_CONN starts with: $($env:AZURE_STORAGE_CONN.Substring(0, [Math]::Min(50, $env:AZURE_STORAGE_CONN.Length)))"
            
            if (Test-Path $configPath) {
              $config = Get-Content $configPath | ConvertFrom-Json
              $modified = $false
              
              # Inject if environment variables have real values (not empty, not the variable placeholder)
              if ($env:AZURE_STORAGE_CONN -and $env:AZURE_STORAGE_CONN.Length -gt 10) {
                Write-Host "✓ Injecting Azure Storage connection string (length: $($env:AZURE_STORAGE_CONN.Length))"
                $config.ConnectionString = $env:AZURE_STORAGE_CONN
                $modified = $true
              } else {
                Write-Host "Using connection string from config.json"
              }
              
              if ($env:AZURE_SQL_CONN -and $env:AZURE_SQL_CONN.Length -gt 10) {
                Write-Host "✓ Injecting SQL connection string (length: $($env:AZURE_SQL_CONN.Length))"
                $config.SQLConnectionString = $env:AZURE_SQL_CONN
                $modified = $true
              } else {
                Write-Host "Using SQL connection string from config.json"
              }
              
              if ($env:AZURE_COG_API_KEY -and $env:AZURE_COG_API_KEY.Length -gt 10) {
                Write-Host "✓ Injecting Azure Cognitive Services API key (length: $($env:AZURE_COG_API_KEY.Length))"
                $config.AzureCognitiveServiceAPIKey = $env:AZURE_COG_API_KEY
                $modified = $true
              } else {
                Write-Host "Using API key from config.json"
              }
              
              if ($env:APPINSIGHTS_CONNECTION_STRING -and $env:APPINSIGHTS_CONNECTION_STRING.Length -gt 10) {
                Write-Host "✓ Injecting Application Insights connection string (length: $($env:APPINSIGHTS_CONNECTION_STRING.Length))"
                if ($config.PSObject.Properties.Name -contains "app_insights_connection_string") {
                  $config.app_insights_connection_string = $env:APPINSIGHTS_CONNECTION_STRING
                } else {
                  $config | Add-Member -NotePropertyName "app_insights_connection_string" -NotePropertyValue $env:APPINSIGHTS_CONNECTION_STRING
                }
                $modified = $true
              } else {
                Write-Host "Using Application Insights connection string from config.json"
              }
              
              if ($modified) {
                $config | ConvertTo-Json -Depth 10 | Set-Content $configPath
                Write-Host "✓✓✓ Config updated with injected secrets ✓✓✓"
              } else {
                Write-Host "No secrets to inject, using config.json values"
              }
            } else {
              Write-Warning "Config file not found at $configPath"
            }
          pwsh: true
        env:
          AZURE_STORAGE_CONN: $(AZURE_STORAGE_CONN)
          AZURE_SQL_CONN: $(AZURE_SQL_CONN)
          AZURE_COG_API_KEY: $(AZURE_COG_API_KEY)
          APPINSIGHTS_CONNECTION_STRING: $(APPINSIGHTS_CONNECTION_STRING)

      - task: PowerShell@2
        displayName: 'Run Function1 - Extract & Upload'
        inputs:
          filePath: 'scripts/function1.ps1'
          pwsh: true
        continueOnError: true

      - task: PowerShell@2
        displayName: 'Run Function2 - Translate'
        inputs:
          filePath: 'scripts/function2.ps1'
          pwsh: true
        continueOnError: true

      # ✅ NEW: Send SLA metrics collected by Function1/Function2 to Azure Application Insights
      # function1.ps1 and function2.ps1 write SLA reports to logs/*.json but never send to App Insights.
      # This step reads those reports and POSTs them via the App Insights REST Track API so data
      # appears in Azure Portal under Application Insights > Logs (traces & customEvents tables).
      - task: PowerShell@2
        displayName: 'Send SLA Metrics to Application Insights'
        condition: always()
        inputs:
          targetType: 'inline'
          script: |
            $configPath = "config.json"
            if (!(Test-Path $configPath)) {
              Write-Warning "config.json not found - skipping App Insights telemetry"
              exit 0
            }

            $config = Get-Content $configPath | ConvertFrom-Json
            $appInsightsConnStr = $config.app_insights_connection_string

            if ([string]::IsNullOrWhiteSpace($appInsightsConnStr) -or $appInsightsConnStr.Length -lt 10) {
              Write-Warning "app_insights_connection_string not configured - skipping telemetry (set APPINSIGHTS_CONNECTION_STRING pipeline variable)"
              exit 0
            }

            # Parse InstrumentationKey and IngestionEndpoint from connection string
            $iKey = ($appInsightsConnStr -split ";") |
                    Where-Object { $_ -like "InstrumentationKey=*" } |
                    ForEach-Object { $_ -replace "InstrumentationKey=", "" }
            $ingestionRaw = ($appInsightsConnStr -split ";") |
                            Where-Object { $_ -like "IngestionEndpoint=*" } |
                            ForEach-Object { $_ -replace "IngestionEndpoint=", "" }
            $ingestionEndpoint = if ($ingestionRaw) {
              $ingestionRaw.TrimEnd("/") + "/v2/track"
            } else {
              "https://dc.services.visualstudio.com/v2/track"
            }

            if ([string]::IsNullOrWhiteSpace($iKey)) {
              Write-Warning "Could not parse InstrumentationKey from connection string - check format"
              exit 0
            }

            Write-Host "✅ App Insights configured (iKey starts: $($iKey.Substring(0, [Math]::Min(8,$iKey.Length)))...)"
            Write-Host "📡 Ingestion endpoint: $ingestionEndpoint"

            # Helper: POST one telemetry item to App Insights REST API
            function Send-AppInsightsTelemetry {
              param([hashtable]$Item)
              $payload = @($Item) | ConvertTo-Json -Depth 10
              try {
                Invoke-RestMethod -Method POST -Uri $ingestionEndpoint `
                  -ContentType "application/json" -Body $payload -ErrorAction Stop | Out-Null
                return $true
              } catch {
                Write-Warning "App Insights POST failed: $_"
                return $false
              }
            }

            $sentCount = 0

            # All SLA log files that function1.ps1 / function2.ps1 may have written
            $slaLogPaths = @(
              "logs/sla-metrics-function2.json",
              "logs/sla-metrics-function1.json",
              "logs/sla-metrics.json"
            )

            foreach ($logPath in $slaLogPaths) {
              if (!(Test-Path $logPath)) {
                Write-Host "No log at $logPath - skipping"
                continue
              }

              Write-Host "📊 Processing $logPath ..."
              try {
                $slaData = Get-Content $logPath -Raw | ConvertFrom-Json
                $run = $slaData.Run
                if ($null -eq $run) {
                  Write-Warning "No 'Run' object found in $logPath"
                  continue
                }

                # Build flat string properties for App Insights custom dimensions
                $props = @{
                  RunId              = [string]$run.RunId
                  Status             = [string]$run.Status
                  DurationSeconds    = [string]$run.DurationSeconds
                  TotalSentences     = [string]$run.TotalSentences
                  TotalLanguages     = [string]$run.TotalLanguages
                  TotalTokens        = [string]$run.TotalTokens
                  SLAViolation       = [string]$run.SLAViolation
                  SLADeadlineSeconds = [string]$run.SLADeadlineSeconds
                  Throughput         = [string]$run.Throughput
                  P50LatencyMs       = if ($run.LatencyPercentiles) { [string]$run.LatencyPercentiles.P50 } else { "N/A" }
                  P95LatencyMs       = if ($run.LatencyPercentiles) { [string]$run.LatencyPercentiles.P95 } else { "N/A" }
                  P99LatencyMs       = if ($run.LatencyPercentiles) { [string]$run.LatencyPercentiles.P99 } else { "N/A" }
                  NMTCount           = if ($run.ModelUsageStats)    { [string]$run.ModelUsageStats.NMTCount } else { "0" }
                  LLMCount           = if ($run.ModelUsageStats)    { [string]$run.ModelUsageStats.LLMCount } else { "0" }
                  PipelineBuildId    = [string]$env:BUILD_BUILDID
                  PipelineName       = [string]$env:BUILD_DEFINITIONNAME
                  SourceBranch       = [string]$env:BUILD_SOURCEBRANCH
                  LogSource          = $logPath
                }

                # Build numeric measurements
                $measurements = @{
                  DurationSeconds = [double]$run.DurationSeconds
                  TotalSentences  = [double]$run.TotalSentences
                  TotalTokens     = [double]$run.TotalTokens
                  Throughput      = [double]$run.Throughput
                }
                if ($run.LatencyPercentiles) {
                  $measurements["P50LatencyMs"] = [double]$run.LatencyPercentiles.P50
                  $measurements["P95LatencyMs"] = [double]$run.LatencyPercentiles.P95
                  $measurements["P99LatencyMs"] = [double]$run.LatencyPercentiles.P99
                }

                # iKey prefix used in envelope name (32 hex chars, dashes removed)
                $iKeyHex = $iKey.Replace("-","").Substring(0, [Math]::Min(32, $iKey.Replace("-","").Length))

                # 1. Send as CustomEvent (appears in customEvents table in App Insights)
                $eventItem = @{
                  name = "Microsoft.ApplicationInsights.$iKeyHex.Event"
                  time = (Get-Date -Format "yyyy-MM-ddTHH:mm:ss.fffZ")
                  iKey = $iKey
                  data = @{
                    baseType = "EventData"
                    baseData = @{
                      ver          = 2
                      name         = "LocalizationSLAMetrics"
                      properties   = $props
                      measurements = $measurements
                    }
                  }
                }
                if (Send-AppInsightsTelemetry -Item $eventItem) {
                  $sentCount++
                  Write-Host "✅ Sent CustomEvent: LocalizationSLAMetrics (RunId: $($run.RunId))"
                }

                # 2. Send as Trace (appears in traces table, so KQL queries like
                #    'traces | where message == "LocalizationSLAMetrics"' work)
                $traceItem = @{
                  name = "Microsoft.ApplicationInsights.$iKeyHex.Message"
                  time = (Get-Date -Format "yyyy-MM-ddTHH:mm:ss.fffZ")
                  iKey = $iKey
                  data = @{
                    baseType = "MessageData"
                    baseData = @{
                      ver           = 2
                      message       = "LocalizationSLAMetrics"
                      severityLevel = 1
                      properties    = $props
                    }
                  }
                }
                if (Send-AppInsightsTelemetry -Item $traceItem) { $sentCount++ }

                # 3. If SLA violated, send Exception so Azure Alerts can trigger
                if ($run.SLAViolation -eq $true) {
                  $exItem = @{
                    name = "Microsoft.ApplicationInsights.$iKeyHex.Exception"
                    time = (Get-Date -Format "yyyy-MM-ddTHH:mm:ss.fffZ")
                    iKey = $iKey
                    data = @{
                      baseType = "ExceptionData"
                      baseData = @{
                        ver = 2
                        exceptions = @(@{
                          typeName     = "SLAViolationException"
                          message      = "SLA Violation: run $($run.RunId) took $($run.DurationSeconds)s (deadline $($run.SLADeadlineSeconds)s)"
                          hasFullStack = $false
                        })
                        properties = $props
                      }
                    }
                  }
                  if (Send-AppInsightsTelemetry -Item $exItem) {
                    $sentCount++
                    Write-Host "⚠️ Sent SLA Violation exception to App Insights"
                  }
                }
              } catch {
                Write-Warning "Error processing $logPath : $_"
              }
            }

            Write-Host ""
            Write-Host "📡 Total telemetry items sent to App Insights: $sentCount"
            if ($sentCount -eq 0) {
              Write-Warning "No SLA log files found. Verify Function1/Function2 ran and EnableSLALogging=true in config.json"
            } else {
              Write-Host "✅ Telemetry sent! Check Azure Portal > Application Insights > Logs in 2-5 minutes."
              Write-Host "   KQL: customEvents | where name == 'LocalizationSLAMetrics' | order by timestamp desc"
              Write-Host "   KQL: traces | where message == 'LocalizationSLAMetrics' | order by timestamp desc"
            }
          pwsh: true
        env:
          BUILD_BUILDID: $(Build.BuildId)
          BUILD_DEFINITIONNAME: $(Build.DefinitionName)
          BUILD_SOURCEBRANCH: $(Build.SourceBranch)

      - task: PowerShell@2
        displayName: 'Commit and Push Translated Files'
        inputs:
          targetType: 'inline'
          script: |
            git config user.email "pipeline@azure.com"
            git config user.name "Azure Pipeline"
            git add target-folder/
            git commit -m "chore: add localized .resx files [skip ci]" || echo "No changes to commit"
            git push origin HEAD:main
          pwsh: true
        
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Logs'
        condition: always()
        inputs:
          PathtoPublish: 'logs'
          ArtifactName: 'logs'
          publishLocation: 'Container'
